name: Build Turnip (Adreno 750)

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: Mesa branch or tag (main = latest)
        default: main
      patches:
        description: Apply patches/ (off = stock Mesa baseline)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools flex bison patchelf zip
          pip install --break-system-packages meson mako pyyaml packaging

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Get Mesa
        run: git clone --depth 1 --branch "${{ inputs.mesa_ref }}" https://gitlab.freedesktop.org/mesa/mesa.git

      - name: Apply patches
        if: inputs.patches
        run: for p in repo/patches/*.patch; do echo "== $p"; git -C mesa apply "../$p"; done

      - name: Cross file
        run: |
          # ponytail: NDK comes preinstalled on the runner, no download
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > android-aarch64.ini <<EOF
          [binaries]
          ar = '$BIN/llvm-ar'
          c = ['$BIN/aarch64-linux-android34-clang']
          cpp = ['$BIN/aarch64-linux-android34-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables']
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = '$BIN/llvm-strip'
          # ponytail: no host pkg-config, x86 libs (zstd, spirv-tools...) were leaking into the Android build
          pkg-config = 'false'

          [built-in options]
          # ponytail: SD 8 Gen 3 features only (no SVE: Qualcomm disables it, SVE = instant SIGILL)
          c_args = ['-march=armv8.6-a+dotprod+i8mm+bf16', '-mtune=cortex-x4']
          cpp_args = ['-march=armv8.6-a+dotprod+i8mm+bf16', '-mtune=cortex-x4']
          cpp_link_args = ['-static-libstdc++']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

      - name: Build
        working-directory: mesa
        run: |
          meson setup build --cross-file ../android-aarch64.ini \
            -Dbuildtype=release \
            -Dplatforms=android -Dplatform-sdk-version=34 \
            -Dandroid-stub=true -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers= -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl -Dvulkan-beta=true \
            -Dopengl=false -Degl=disabled -Dgles1=disabled -Dgles2=disabled -Dglx=disabled \
            -Dzstd=disabled
          ninja -C build src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Package for AdrenoTools
        run: |
          VER="$(cat mesa/VERSION)-$(git -C mesa rev-parse --short HEAD)"
          [ "${{ inputs.patches }}" = "true" ] || VER="$VER-stock"
          VER="$VER-r${{ github.run_number }}"  # ponytail: unique tag when Mesa hasn't moved between builds
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir pkg
          cp mesa/build/src/freedreno/vulkan/libvulkan_freedreno.so pkg/vulkan.ad07xx.so
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" pkg/vulkan.ad07xx.so
          patchelf --set-soname vulkan.adreno.so pkg/vulkan.ad07xx.so
          cat > pkg/meta.json <<EOF
          {
            "schemaVersion": 1,
            "name": "Turnip A750 $VER",
            "description": "Mesa Turnip built for Snapdragon 8 Gen 3 / Adreno 750",
            "author": "turnip-a750",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "$VER",
            "minApi": 27,
            "libraryName": "vulkan.ad07xx.so"
          }
          EOF
          cd pkg && zip ../turnip-a750-$VER.zip *

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VER" "turnip-a750-$VER.zip" -R "$GITHUB_REPOSITORY" --title "Turnip A750 $VER" --notes "Mesa ${{ inputs.mesa_ref }} @ $VER"
